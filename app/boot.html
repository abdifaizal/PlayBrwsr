<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>PlayBrwsr</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: "Segoe UI", system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #27272a;
      border-top-color: #e11d48;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label { font-size: 14px; color: #a1a1aa; }
    .retry {
      display: none;
      margin-top: 8px;
      padding: 8px 18px;
      background: #e11d48;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="label" id="status">Menghubungkan ke Browsec VPN (Singapore)...</div>
  <a class="retry" id="retryBtn" href="#">Buka Sekarang</a>
  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get("mode") || "video";
    const target = mode === "music" ? "https://music.youtube.com/" : "https://www.youtube.com/";
    document.title = mode === "music" ? "YouTube Music" : "YouTube";
    const statusEl = document.getElementById("status");
    const retryBtn = document.getElementById("retryBtn");
    retryBtn.href = target;

    setTimeout(() => {
      statusEl.textContent = "Membuka " + document.title + "...";
      window.location.replace(target);
    }, 4000);

    setTimeout(() => {
      statusEl.textContent = "Koneksi agak lambat, mencoba ulang...";
      retryBtn.style.display = "inline-block";
    }, 14000);
  </script>
</body>
</html>
